<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5"><meta name="theme-color" content="#faf4ff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Day Buddy"><title>Day Buddy</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#26143f;font-family:-apple-system,BlinkMacSystemFont,'Trebuchet MS',sans-serif}button{font:inherit;cursor:pointer} .home{max-width:600px;margin:auto;position:relative}.home img{width:100%;height:auto;display:block}.hot{position:absolute;border:0;background:transparent;border-radius:14px;cursor:pointer}.hot:focus-visible{outline:4px solid #7237a2;background:#ffffff44}.page{display:none;min-height:100vh;max-width:600px;margin:auto;padding:16px;background:linear-gradient(#fff9f2,#f3e6ff)}.page.on{display:block}.home.off{display:none}.top{display:flex;align-items:center;gap:12px;margin-bottom:20px}.back{background:#e8d1fb;border:1px solid #a86ed8;border-radius:14px;padding:10px 16px;font-weight:800}.title{font-size:28px;margin:10px 0;color:#5b167e}.intro{font-size:16px;line-height:1.5}.activity{display:flex;align-items:center;gap:12px;background:white;border:1px solid #ddc3ec;border-radius:18px;margin:10px 0;padding:16px;min-height:62px}.activity input{width:23px;height:23px;accent-color:#7935a7;flex:none}.activity label{flex:1;font-weight:650}.hint{font-size:13px;color:#6b5279}.pill{display:inline-block;background:#eee0fb;border-radius:25px;padding:7px 12px;font-weight:700}.event{border-radius:16px;background:white;border:1px solid #ddc3ec;padding:12px;margin:10px 0}.event strong{display:block}.event small{display:block;color:#745c84}.event button{float:right;background:#fff0f0;border:0;border-radius:8px;padding:5px}.field{display:block;width:100%;padding:12px;margin:8px 0;border-radius:12px;border:1px solid #c4a1d6;font-size:16px}.primary{background:#6f269d;color:white;border:0;padding:13px 18px;border-radius:14px;font-weight:800}.note{background:#fff5d7;border-radius:12px;padding:12px;font-size:13px;line-height:1.5} .foot{text-align:center;margin:24px 0;color:#735889;font-size:13px}

/* Live text overlays preserve the approved illustration and replace only changing details. */
.live{pointer-events:none;position:absolute;z-index:2;overflow:hidden;color:#201038;font-family:-apple-system,BlinkMacSystemFont,'Arial Rounded MT Bold',sans-serif}
.live-date{left:6.1%;top:22.7%;width:46.5%;height:5.4%;background:#fffdfb;display:flex;align-items:center;font-size:clamp(12px,4.25vw,27px);font-weight:1000;letter-spacing:-.7px;color:#08050a;white-space:nowrap}
.live-month{left:69%;top:11%;width:27%;height:16.5%;background:#fff4e5;border-radius:8px;padding:2px 3px;text-align:center;font-size:clamp(7px,2vw,12px)}
.live-month .m-title{font-size:1.45em;font-weight:900;margin:0 0 4px}.m-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px 0;align-items:center}.m-grid span{min-height:1.35em;font-weight:650}.m-grid .today{background:#98551f;color:white;border-radius:4px}
.live-weather{left:15%;top:38%;width:28%;height:8%;background:#eef8ff;display:flex;align-items:center;gap:7px;padding:2px;color:#14112f}.live-weather .temp{font-size:clamp(16px,4.5vw,27px);font-weight:950;white-space:nowrap}.live-weather .conditions{font-size:clamp(8px,2.4vw,15px);font-weight:800;line-height:1.2}
.live-next{left:48%;top:35%;width:48%;height:10.5%;background:#fff9fc;padding:1px 3px;display:flex;flex-direction:column;justify-content:space-evenly}.live-next .next-row{font-size:clamp(7px,2vw,12px);line-height:1.25;border-left:3px solid #e5a40b;padding:2px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.live-next .next-row:nth-child(2){border-color:#a368e1}.live-next .next-row:nth-child(3){border-color:#66bb70}.live-next .next-row strong{font-weight:900}.live-next .empty{font-size:clamp(8px,2.3vw,14px);line-height:1.4}
@media(min-width:600px){.live-date{font-size:26px}.live-month{font-size:12px}.live-weather .temp{font-size:27px}.live-weather .conditions{font-size:15px}.live-next .next-row{font-size:12px}}

/* Compact calendar with explicit table rows for older Safari. */
.live-month{height:19%;padding:2px 2px;display:block;font-size:clamp(7px,1.9vw,12px);line-height:1;color:#201038}
.live-month .m-title{font-size:1.25em;line-height:1.15;margin:0 0 2px;white-space:nowrap}
.month-table{width:100%;height:calc(100% - 1.5em);table-layout:fixed;border-collapse:collapse;font-size:inherit;line-height:1;color:#201038}
.month-table td{text-align:center;padding:0;vertical-align:middle;font-weight:650}
.month-table .today{background:#98551f;color:white;border-radius:3px}

.dash-slice{position:relative;overflow:hidden;height:0;padding-bottom:66.66666666666666%;}.dash-inner{position:absolute;top:0;left:0;width:100%;}.dash-inner.lower{transform:translateY(-50%)}.event-cards{padding:8px 12px 12px;background:#fff9fc}.event-cards[hidden]{display:none}.event-cards h2{font-size:16px;margin:0 0 8px;color:#54277c}.event-card{display:flex;align-items:center;border-radius:12px;padding:9px 10px;margin:0 0 6px;color:#38234c;line-height:1.3}.event-icon{font-size:25px;width:38px;flex-shrink:0}.event-copy{min-width:0;overflow-wrap:break-word}.event-copy strong{display:block;font-size:17px}.event-copy span{display:block;font-size:13px}.live-next .next-row{white-space:normal;overflow:hidden}.live-next .next-row strong{display:block}

w('okay')"></button><button class="hot" style="left:75%;top:61.5%;width:22%;height:10.5%" aria-label="Flow activities" onclick="show('flow')"></button></div></div></main><section id="page" class="page"><div class="top"><button class="back" onclick="home()">← Home</button><span class="pill">Day Buddy 💜</span></div><div id="content"></div><div class="foot">One thing at a time. Your day, your pace.</div></section><script>
const modes={calm:{icon:'🌙',name:'Calm Reset',intro:'Low energy? Keep it gentle. Pick just one thing that feels good.',items:['Have a drink and a snack','Listen to music with headphones','Watch a favourite film or series','Take a shower and change into fresh clothes','Read or listen to something interesting','Tidy one tiny area for five minutes','Step outside for some fresh air']},okay:{icon:'☀️',name:'Doing OK',intro:'A balanced day. Choose one thing to enjoy or get done.',items:['Take a short walk','Play The Sims or check your Tamagotchi','Do a 10-minute room reset','Try a little maths practice','Make a simple meal','Visit a charity shop','Choose something to do later this week']},flow:{icon:'✨',name:'Flow',intro:'Feeling energised? Pick something satisfying, with breaks when you need them.',items:['Go swimming','Plan a cinema trip','Explore a museum','Work on a maths or history goal','Sort items to sell','Go on a longer outing','Organise a favourite collection']}};
function show(mode){document.getElementById('home').classList.add('off');document.getElementById('page').classList.add('on');let c=document.getElementById('content');if(mode==='calendar'){calendar();}else{let m=modes[mode];c.innerHTML='<div class="pill">'+m.icon+' '+m.name+'</div><h1 class="title">What feels good today?</h1><p class="intro">'+m.intro+'</p><p class="hint">Tick anything you do. Nothing here is compulsory.</p>'+m.items.map((v,i)=>'<div class="activity"><input id="a'+i+'" type="checkbox" '+(localStorage.getItem('buddy-'+mode+'-'+i)==='true'?'checked':'')+' onchange="localStorage.setItem(\'buddy-'+mode+'-'+i+'\',this.checked)"><label for="a'+i+'">'+v+'</label></div>').join('')+'<button class="primary" onclick="home()">Back to my day</button>';}window.scrollTo(0,0)}
function home(){document.getElementById('page').classList.remove('on');document.getElementById('home').classList.remove('off');window.scrollTo(0,0)}
function getEvents(){try{return JSON.parse(localStorage.getItem('buddy-events')||'[]')}catch(e){return []}}
function calendar(){let e=getEvents().sort((a,b)=>a.date.localeCompare(b.date));document.getElementById('content').innerHTML='<h1 class="title">📅 What’s Coming Next</h1><p class="intro">Your real appointments go here. Appointments added here stay on this device.</p>'+ (e.length?e.map((v,i)=>'<div class="event"><button aria-label="Delete appointment" onclick="delEvent('+i+')">✕</button><strong>'+escapeText(v.name)+'</strong><small>'+escapeText(v.date.replace('T',' at '))+'</small></div>').join(''):'<div class="note">No appointments added yet.</div>')+'<h2>Add an appointment</h2><form onsubmit="addEvent(event)"><input class="field" id="eventName" required placeholder="What is happening?" maxlength="80"><input class="field" id="eventDate" type="datetime-local" required><button class="primary" type="submit">Add to Coming Up</button></form>'}
function escapeText(s){return String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function addEvent(e){e.preventDefault();let a=getEvents();a.push({name:document.getElementById('eventName').value,date:document.getElementById('eventDate').value});localStorage.setItem('buddy-events',JSON.stringify(a));calendar();updateNext()}
function delEvent(i){let a=getEvents().sort((x,y)=>x.date.localeCompare(y.date));a.splice(i,1);localStorage.setItem('buddy-events',JSON.stringify(a));calendar();updateNext()}

function updateDate(){const d=new Date();document.getElementById("dayName").textContent=d.toLocaleDateString("en-GB",{weekday:"long"}).toUpperCase()+"!";document.getElementById("seasonName").textContent=["Winter","Spring","Summer","Autumn"][Math.floor((d.getMonth()+1)%12/3)];document.getElementById('liveDate').textContent=d.toLocaleDateString('en-GB',{month:'long',day:'numeric',year:'numeric'}).replace(/(\d+)(?= )/, '$1');const month=d.toLocaleDateString('en-GB',{month:'long',year:'numeric'});const first=new Date(d.getFullYear(),d.getMonth(),1).getDay();const offset=(first+6)%7;const count=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();let cells=['Mo','Tu','We','Th','Fr','Sa','Su'].map(v=>'<span>'+v+'</span>');for(let i=0;i<offset;i++)cells.push('<span></span>');for(let day=1;day<=count;day++)cells.push('<span class="'+(day===d.getDate()?'today':'')+'">'+day+'</span>');while(cells.length<49)cells.push('<span></span>');let rows='';for(let i=0;i<49;i+=7){rows+='<tr>'+cells.slice(i,i+7).map(function(cell){return cell.replace('<span','<td').replace('</span>','</td>')}).join('')+'</tr>'}document.getElementById('liveMonth').innerHTML='<div class="m-title">'+month+'</div><table class="month-table" aria-label="Monthly calendar"><tbody>'+rows+'</tbody></table>'}
function updateNext(){let now=new Date();let upcoming=getEvents().filter(e=>new Date(e.date)>=new Date(now.getTime()-86400000)).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,3);document.getElementById('liveNext').innerHTML=upcoming.length?upcoming.map(e=>'<div class="next-row"><strong>'+escapeText(new Date(e.date).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}))+'</strong> '+escapeText(e.name)+'<div>'+escapeText(new Date(e.date).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}))+'</div></div>').join(''):'<div class="empty">No upcoming appointments yet.<div>Tap here to add one 📅</div></div>'}
function updateWeather(){document.getElementById('liveWeather').innerHTML='<span class="conditions">Check your local forecast</span>';}

// Private on-device calendar preview. URL fragment is not sent to the web server.
function importCalendarPreview(){
  if(location.hash.indexOf('#appointments=')!==0)return;
  try{
    const raw=decodeURIComponent(location.hash.slice(14));
    const titles=raw.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).slice(0,3).map(x=>x.slice(0,160));
    localStorage.setItem('buddy-calendar-preview',JSON.stringify({titles:titles,updated:Date.now()}));
    history.replaceState(null,'',location.pathname+location.search);
  }catch(e){document.getElementById('liveNext').textContent='Calendar update could not be read.';}
}
const originalUpdateNext=updateNext;
function eventStyle(name){
 const rules=[[/swim/i,'🏊','#d8edff'],[/cinema|film|movie/i,'🍿','#ffe8bd'],[/disco|party|social/i,'🎵','#e9d8fa'],[/math|school|college|tutor|lesson|education/i,'📚','#dcefd5'],[/shop/i,'🛍','#f9dce9'],[/walk|park/i,'🌳','#d8f1e5']];
 for(let i=0;i<rules.length;i++){if(rules[i][0].test(name))return rules[i].slice(1);}return ['📅','#ffe4d5'];
}
updateNext=function(){
 let data;try{data=JSON.parse(localStorage.getItem('buddy-calendar-preview')||'null')}catch(e){}
 const cards=document.getElementById('eventCards');cards.textContent='';cards.hidden=true;
 if(!data){originalUpdateNext();return;}
 const el=document.getElementById('liveNext');el.textContent='';
 if(Date.now()-data.updated>86400000){el.textContent='Calendar needs refreshing. Open Day Buddy Update.';return;}
 if(!data.titles.length){el.textContent='No upcoming appointments.';return;}
 const heading=document.createElement('h2');heading.textContent='What’s Coming Next';cards.appendChild(heading);cards.hidden=false;
 data.titles.forEach(function(line,i){
 const split=line.lastIndexOf(' | ');const name=split<0?line:line.slice(0,split);const date=split<0?'':line.slice(split+3);const style=eventStyle(name);
 const row=document.createElement('div');row.className='event-card';row.style.backgroundColor=style[1];
 const icon=document.createElement('span');icon.className='event-icon';icon.textContent=style[0];icon.setAttribute('aria-hidden','true');row.appendChild(icon);
 const copy=document.createElement('div');copy.className='event-copy';const title=document.createElement('strong');title.textContent=name;copy.appendChild(title);
 if(date){const parts=date.split(',');const day=document.createElement('span');day.textContent=parts[0].trim();copy.appendChild(day);if(parts.length>1){const time=document.createElement('span');time.textContent=parts.slice(1).join(',').trim();copy.appendChild(time);}}
 row.appendChild(copy);cards.appendChild(row);
 if(i===0){const summary=document.createElement('div');summary.className='next-row';summary.style.backgroundColor=style[1];summary.textContent=style[0]+' '+name+(date?' · '+date:'');el.appendChild(summary);}
 });
};
window.addEventListener('hashchange',function(){importCalendarPreview();updateNext();});
importCalendarPreview();

updateDate();updateNext();updateWeather();setInterval(()=>{updateDate();updateNext()},60000);setInterval(updateWeather,900000);
</script></body></html>
